    chart: kyverno
    targetRevision: "3.3.3"
    helm:
      releaseName: kyverno
      namespace: kyverno
  destination:
    server: https://F34A6680DB27ABDBE242F4C47AA534A2.yl4.eu-west-1.eks.amazonaws.com
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
