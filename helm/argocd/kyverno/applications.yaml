  namespace: argocd
spec:
  project: hub
  source:
    repoURL: https://github.com/amohsenter09-github/weather-platform-terraform.git
    targetRevision: master
    path: helm/kyverno-policies
  destination:
    server: https://kubernetes.default.svc
    namespace: ""
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
