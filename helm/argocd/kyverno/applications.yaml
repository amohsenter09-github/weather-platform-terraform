# Argo CD Applications: deploy Kyverno to hub and each workload cluster
# Apply after Argo CD is installed: kubectl apply -f helm/argocd/kyverno/
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-hub
  namespace: argocd
spec:
  project: hub
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: "3.3.3"
    helm:
      releaseName: kyverno
      namespace: kyverno
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
